<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NASA Space Explorer</title>
  <link href="style.css" rel="stylesheet" type="text/css" />
</head>
<body>
  <div class="container">
    <header class="site-header">
      <img src="img/nasa-worm-logo.png" alt="NASA Logo" class="logo" />
      <h1>Space Explorer</h1>
    </header>

    <div class="filters">
      <label>
        <span>From</span>
        <input type="date" id="startDate" />
      </label>
      <label>
        <span>To</span>
        <input type="date" id="endDate" />
      </label>
      <button id="searchButton">Explore APODs</button>
    </div>

    <aside class="fact-panel" aria-live="polite">
      <p class="eyebrow">DID YOU KNOW?</p>
      <p id="spaceFact"></p>
    </aside>
    <p id="status" class="status" aria-live="polite"></p>
    <div id="gallery" class="gallery">
      <div class="placeholder">
        <div class="placeholder-icon">🔭</div>
        <p>Select a date range and click "Get Space Images" to explore the cosmos!</p>
      </div>
    </div>

    <section id="videoSection" class="video-section" aria-labelledby="videoHeading">
      <div class="section-heading">
        <p class="eyebrow">MORE TO EXPLORE</p>
        <h2 id="videoHeading">Video discoveries</h2>
      </div>
      <div id="videoGallery" class="video-gallery"></div>
    </section>
  </div>

  <div id="detailModal" class="modal" aria-hidden="true">
    <div class="modal-backdrop" data-close-modal></div>
    <section class="modal-content" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
      <button class="modal-close" type="button" aria-label="Close image details" data-close-modal>&times;</button>
      <div id="modalMedia" class="modal-media"></div>
      <div class="modal-copy">
        <p id="modalDate" class="item-date"></p>
        <h2 id="modalTitle"></h2>
        <p id="modalExplanation"></p>
      </div>
    </section>
  </div>

  <script src="js/dateRange.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
